<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 브라우저 탭/북마크에서 서비스 식별에 쓰는 기본 아이콘(레거시 브라우저 호환용) -->
    <link rel="icon" href="/src/assets/images/favicon.ico" sizes="any" />
    <!-- 아이콘은 사장님 앱과 같은 주황 바탕 + 흰 로고(손님 웹은 흰 바탕). 아이폰 "홈 화면에 추가" 아이콘 -->
    <link rel="apple-touch-icon" href="/src/assets/images/apple-touch-icon.png" />
    <!-- viewport-fit=cover: 노치·홈 막대 안전 영역 값(env(safe-area-inset-*))을 받아 휴대폰 화면의 위쪽 줄·아래 탭을 띄운다 -->
    <meta name="color-scheme" content="only light" />
    <!-- maximum-scale=1: 아이폰이 16px보다 작은 입력 칸(앱 본문 15)을 누를 때 화면을 확대하지 않게. 손님 웹과 같음. 사파리 두 손가락 확대는 그대로 된다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- 탭 제목은 사장님 앱 이름과 같게 -->
    <title>픽케이크 사장님</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
